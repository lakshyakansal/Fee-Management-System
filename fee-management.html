<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fee Management System</title>
<style>
:root{--bg:#eef2f5;--card:#fff;--ink:#14232e;--mute:#5d6f7b;--line:#d6dee4;--pri:#0f5c6e;--pri-ink:#fff;--ok:#1c7c4a;--bad:#b3341f;--warn:#9a6700;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e171d;--card:#16232b;--ink:#e6eef2;--mute:#8fa3af;--line:#27373f;--pri:#4fb3c8;--pri-ink:#07181d;--ok:#4cc58a;--bad:#ff8a73;--warn:#e3b341}}
:root[data-theme="dark"]{--bg:#0e171d;--card:#16232b;--ink:#e6eef2;--mute:#8fa3af;--line:#27373f;--pri:#4fb3c8;--pri-ink:#07181d;--ok:#4cc58a;--bad:#ff8a73;--warn:#e3b341}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
header{background:var(--pri);color:var(--pri-ink);padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:18px;font-weight:650}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;color:inherit;border:1px solid transparent;padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{border-color:currentColor;font-weight:600}
main{max-width:1050px;margin:0 auto;padding:20px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
.stat b{display:block;font-size:24px}.stat span{color:var(--mute);font-size:13px}
h2{font-size:16px;margin:0 0 12px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}
input,select{width:100%;padding:8px 10px;margin-top:3px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.btn{background:var(--pri);color:var(--pri-ink);border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit;font-weight:600}
.btn.alt{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.btn.sm{padding:3px 8px;font-size:13px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--mute);font-weight:600}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.bar input,.bar select{width:auto;flex:1;min-width:140px;margin:0}
.empty{color:var(--mute);padding:18px 0;text-align:center}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;display:none}
.rcpt{border:2px solid var(--ink);padding:18px;max-width:420px;margin:0 auto;background:var(--card)}
.rcpt div{display:flex;justify-content:space-between;padding:3px 0}
@media print{header,nav,.noprint{display:none!important}body{background:#fff;color:#000}main{padding:0}.rcpt{border-color:#000;color:#000;background:#fff}}
</style>
</head>
<body>
<header>
  <h1>Fee Management System</h1>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<div id="toast"></div>
<script>
const K='fms_v1';
let db={courses:[{name:'PG-DAC',fee:95000},{name:'PG-DBDA',fee:90000}],students:[],payments:[],seq:{s:1,r:1}};
try{const r=localStorage.getItem(K);if(r)db=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
const $=s=>document.querySelector(s);
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
const paid=id=>db.payments.filter(p=>p.sid===id).reduce((a,p)=>a+p.amt,0);
const payable=s=>Math.max(0,s.fee-(s.disc||0));
const due=s=>payable(s)-paid(s.id);
const stu=id=>db.students.find(s=>s.id===id);
const status=s=>{const d=due(s);return d<=0?['Paid','ok']:paid(s.id)>0?['Partial','warn']:['Unpaid','bad']};
let tab='dash',q='',flt='all',rcpt=null;
const tabs=[['dash','Dashboard'],['stu','Students'],['pay','Collect fee'],['his','Payments'],['crs','Courses']];

function nav(){$('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}
function go(t){tab=t;rcpt=null;render()}
function render(){nav();$('#app').innerHTML=({dash,stu:students,pay,his,crs})[tab]()}

function dash(){
  const exp=db.students.reduce((a,s)=>a+payable(s),0),col=db.payments.reduce((a,p)=>a+p.amt,0);
  const pending=db.students.filter(s=>due(s)>0).sort((a,b)=>due(b)-due(a)).slice(0,8);
  return `<div class="grid g4">
  <div class="card stat"><b>${db.students.length}</b><span>Students enrolled</span></div>
  <div class="card stat"><b>${inr(exp)}</b><span>Total payable</span></div>
  <div class="card stat"><b class="ok">${inr(col)}</b><span>Collected</span></div>
  <div class="card stat"><b class="bad">${inr(Math.max(0,exp-col))}</b><span>Outstanding</span></div></div>
  <div class="card" style="margin-top:14px"><h2>Highest dues</h2>${pending.length?`<div class="tw"><table><tr><th>Student</th><th>Course</th><th>Paid</th><th>Due</th></tr>${pending.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.course)}</td><td>${inr(paid(s.id))}</td><td class="bad">${inr(due(s))}</td></tr>`).join('')}</table></div>`:'<div class="empty">No pending dues. Add students to get started.</div>'}</div>`}

function students(){
  const list=db.students.filter(s=>(flt==='all'||status(s)[0]===flt)&&(s.name+s.id+s.course+(s.phone||'')).toLowerCase().includes(q.toLowerCase()));
  return `<div class="grid g2"><div class="card"><h2>Add student</h2>
  <label>Full name<input id="n"></label>
  <label>Phone<input id="ph" inputmode="tel"></label>
  <label>Course<select id="c" onchange="$('#f').value=(db.courses.find(c=>c.name===this.value)||{}).fee||0">${db.courses.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></label>
  <label>Course fee (₹)<input id="f" type="number" min="0" value="${(db.courses[0]||{}).fee||0}"></label>
  <label>Discount / scholarship (₹)<input id="d" type="number" min="0" value="0"></label>
  <button class="btn" onclick="addStu()">Add student</button></div>
  <div class="card"><h2>Students</h2><div class="bar"><input placeholder="Search name, ID, course" value="${esc(q)}" oninput="q=this.value;keep()"><select onchange="flt=this.value;render()">${['all','Paid','Partial','Unpaid'].map(o=>`<option ${flt===o?'selected':''}>${o}</option>`).join('')}</select></div>
  <div class="tw"><table><tr><th>ID</th><th>Name</th><th>Course</th><th>Payable</th><th>Paid</th><th>Due</th><th>Status</th><th></th></tr>
  ${list.map(s=>{const st=status(s);return `<tr><td>${s.id}</td><td>${esc(s.name)}</td><td>${esc(s.course)}</td><td>${inr(payable(s))}</td><td>${inr(paid(s.id))}</td><td>${inr(Math.max(0,due(s)))}</td><td class="${st[1]}">${st[0]}</td><td><button class="btn alt sm" onclick="delStu('${s.id}')">Delete</button></td></tr>`}).join('')}</table></div>${list.length?'':'<div class="empty">No students match.</div>'}</div></div>`}
function keep(){const p=$('#app').querySelector('.bar input');const pos=p.selectionStart;render();const n=$('#app').querySelector('.bar input');n.focus();n.setSelectionRange(pos,pos)}
function addStu(){
  const name=$('#n').value.trim(),fee=+$('#f').value,disc=+$('#d').value||0;
  if(!name)return toast('Enter the student name');
  if(!(fee>0))return toast('Enter a course fee');
  if(disc>fee)return toast('Discount cannot exceed the fee');
  const id='S'+String(db.seq.s++).padStart(4,'0');
  db.students.push({id,name,phone:$('#ph').value.trim(),course:$('#c').value,fee,disc});
  save();toast('Student added');render()}
function delStu(id){
  if(!confirm('Delete this student and all their payments?'))return;
  db.students=db.students.filter(s=>s.id!==id);db.payments=db.payments.filter(p=>p.sid!==id);save();render()}

function pay(){
  if(rcpt)return receipt(rcpt);
  const open=db.students.filter(s=>due(s)>0);
  if(!open.length)return `<div class="card empty">No student has a pending due.</div>`;
  return `<div class="card" style="max-width:480px"><h2>Collect fee</h2>
  <label>Student<select id="ps" onchange="showDue()">${open.map(s=>`<option value="${s.id}">${s.id} · ${esc(s.name)}</option>`).join('')}</select></label>
  <p id="dueTxt" class="warn"></p>
  <label>Amount (₹)<input id="pa" type="number" min="1"></label>
  <label>Date<input id="pd" type="date" value="${today()}"></label>
  <label>Mode<select id="pm"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank transfer</option><option>Cheque</option></select></label>
  <label>Reference / note<input id="pr"></label>
  <button class="btn" onclick="takePay()">Record payment</button></div>`}
function showDue(){const s=stu($('#ps').value);if(s){$('#dueTxt').textContent='Due: '+inr(due(s));$('#pa').value=due(s)}}
function takePay(){
  const s=stu($('#ps').value),amt=+$('#pa').value;
  if(!s||!(amt>0))return toast('Enter a valid amount');
  if(amt>due(s))return toast('Amount is more than the due '+inr(due(s)));
  const p={rno:'R'+String(db.seq.r++).padStart(5,'0'),sid:s.id,amt,date:$('#pd').value||today(),mode:$('#pm').value,ref:$('#pr').value.trim()};
  db.payments.push(p);save();rcpt=p.rno;render()}
function receipt(rno){
  const p=db.payments.find(x=>x.rno===rno),s=p&&stu(p.sid);if(!s)return '<div class="card empty">Receipt not found.</div>';
  return `<div class="rcpt"><h2 style="text-align:center">Fee receipt</h2>
  <div><span>Receipt no.</span><b>${p.rno}</b></div><div><span>Date</span><b>${p.date}</b></div>
  <div><span>Student</span><b>${esc(s.name)} (${s.id})</b></div><div><span>Course</span><b>${esc(s.course)}</b></div>
  <div><span>Mode</span><b>${esc(p.mode)}${p.ref?' · '+esc(p.ref):''}</b></div>
  <div><span>Amount paid</span><b>${inr(p.amt)}</b></div>
  <div><span>Total paid so far</span><b>${inr(paid(s.id))}</b></div>
  <div><span>Balance due</span><b>${inr(Math.max(0,due(s)))}</b></div></div>
  <p class="noprint" style="text-align:center"><button class="btn" onclick="window.print()">Print receipt</button> <button class="btn alt" onclick="go('his')">Back to payments</button></p>`}

function his(){
  if(rcpt)return receipt(rcpt);
  const rows=[...db.payments].reverse();
  return `<div class="card"><div class="bar"><h2 style="margin:0;flex:2">Payments</h2><button class="btn alt sm" onclick="csv()">Export CSV</button></div>
  ${rows.length?`<div class="tw"><table><tr><th>Receipt</th><th>Date</th><th>Student</th><th>Amount</th><th>Mode</th><th></th></tr>${rows.map(p=>{const s=stu(p.sid);return `<tr><td>${p.rno}</td><td>${p.date}</td><td>${esc(s?s.name:p.sid)}</td><td>${inr(p.amt)}</td><td>${esc(p.mode)}</td><td><button class="btn alt sm" onclick="rcpt='${p.rno}';render()">Receipt</button> <button class="btn alt sm" onclick="delPay('${p.rno}')">Void</button></td></tr>`}).join('')}</table></div>`:'<div class="empty">No payments recorded yet.</div>'}</div>`}
function delPay(r){if(!confirm('Void this payment? The amount will return to the student’s due.'))return;db.payments=db.payments.filter(p=>p.rno!==r);save();render()}
function csv(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const lines=[['Receipt','Date','Student ID','Name','Course','Amount','Mode','Reference'].map(q).join(',')];
  db.payments.forEach(p=>{const s=stu(p.sid)||{};lines.push([p.rno,p.date,p.sid,s.name,s.course,p.amt,p.mode,p.ref].map(q).join(','))});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'}));a.download='payments.csv';a.click()}

function crs(){
  return `<div class="grid g2"><div class="card"><h2>Add or update course</h2>
  <label>Course name<input id="cn"></label><label>Fee (₹)<input id="cf" type="number" min="0"></label>
  <button class="btn" onclick="addCrs()">Save course</button></div>
  <div class="card"><h2>Fee structure</h2><div class="tw"><table><tr><th>Course</th><th>Fee</th><th></th></tr>${db.courses.map((c,i)=>`<tr><td>${esc(c.name)}</td><td>${inr(c.fee)}</td><td><button class="btn alt sm" onclick="delCrs(${i})">Remove</button></td></tr>`).join('')}</table></div></div></div>`}
function addCrs(){
  const name=$('#cn').value.trim(),fee=+$('#cf').value;
  if(!name||!(fee>0))return toast('Enter a course name and fee');
  const c=db.courses.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(c)c.fee=fee;else db.courses.push({name,fee});
  save();render()}
function delCrs(i){db.courses.splice(i,1);save();render()}

render();
</script>
</body>
</html>
