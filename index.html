<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Fee Management</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1d2433;--mut:#6b7385;--pri:#3b5bdb;--ok:#2f9e44;--warn:#f08c00;--bad:#e03131;--bd:#e3e7f0}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b1f2a;--tx:#e8ebf3;--mut:#98a0b3;--bd:#2a3040}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--pri);color:#fff;padding:16px 20px;font-size:1.2rem;font-weight:600}
main{max-width:1100px;margin:auto;padding:16px;display:grid;gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.stat b{display:block;font-size:1.4rem;margin-top:4px}.stat span{color:var(--mut);font-size:.85rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
h3{margin:0 0 12px}form{display:grid;gap:8px}
input,select,button{padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;width:100%}
button{background:var(--pri);color:#fff;border:0;cursor:pointer;font-weight:600}button.sm{width:auto;padding:6px 10px;font-size:.8rem}button.del{background:var(--bad)}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.tag{padding:2px 8px;border-radius:99px;color:#fff;font-size:.75rem}.PAID{background:var(--ok)}.PARTIAL{background:var(--warn)}.UNPAID{background:var(--bad)}
ul{list-style:none;margin:0;padding:0;font-size:.85rem}li{padding:6px 0;border-bottom:1px solid var(--bd)}li small{color:var(--mut);display:block}
#msg{color:var(--bad);min-height:1.2em;font-size:.85rem}
</style></head><body>
<header>💰 Fee Management System</header>
<main>
<div class="stats" id="stats"></div>
<div class="grid">
 <div class="card"><h3>Add Student</h3>
  <form id="sf"><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email">
  <input name="course" placeholder="Course"><input name="totalFee" type="number" min="0" step="0.01" placeholder="Total fee" required>
  <button>Add Student</button></form></div>
 <div class="card"><h3>Record Payment</h3>
  <form id="pf"><select name="studentId" id="sel" required></select>
  <input name="amount" type="number" min="1" step="0.01" placeholder="Amount" required>
  <select name="method"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank Transfer</option></select>
  <button>Save Payment</button></form><div id="msg"></div></div>
</div>
<div class="card"><h3>Students</h3><div class="wrap"><table><thead><tr><th>Name</th><th>Course</th><th>Total</th><th>Paid</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></div>
<div class="card"><h3>Recent Activity <small style="color:var(--mut)">(MongoDB)</small></h3><ul id="logs"></ul></div>
</main>
<script>
const $=s=>document.querySelector(s), money=n=>'₹'+Number(n).toLocaleString('en-IN');
async function api(u,o){const r=await fetch('/api'+u,o&&{method:o.m,headers:{'Content-Type':'application/json'},body:o.b&&JSON.stringify(o.b)});
 if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.message||e.error||'Error')}return r.status==204?null:r.json().catch(()=>null)}
async function load(){
 const [st,ss,lg]=await Promise.all([api('/stats'),api('/students'),api('/logs')]);
 $('#stats').innerHTML=[['Students',st.students],['Total Fees',money(st.total)],['Collected',money(st.collected)],['Pending',money(st.pending)]]
  .map(([a,b])=>`<div class="card stat"><span>${a}</span><b>${b}</b></div>`).join('');
 $('#tb').innerHTML=ss.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.course||'-')}</td><td>${money(s.totalFee)}</td><td>${money(s.paid)}</td><td>${money(s.due)}</td>
  <td><span class="tag ${s.status}">${s.status}</span></td><td><button class="sm del" onclick="del(${s.id})">Delete</button></td></tr>`).join('');
 $('#sel').innerHTML='<option value="">Select student</option>'+ss.filter(s=>s.due>0).map(s=>`<option value="${s.id}">${esc(s.name)} (due ${money(s.due)})</option>`).join('');
 $('#logs').innerHTML=lg.map(l=>`<li>${esc(l.action)}: ${esc(l.detail)}<small>${new Date(l.time).toLocaleString()}</small></li>`).join('');
}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function del(id){if(confirm('Delete student and payments?')){await api('/students/'+id,{m:'DELETE'});load()}}
function data(f){const o=Object.fromEntries(new FormData(f));return o}
$('#sf').onsubmit=async e=>{e.preventDefault();await api('/students',{m:'POST',b:data(e.target)});e.target.reset();load()};
$('#pf').onsubmit=async e=>{e.preventDefault();$('#msg').textContent='';
 try{await api('/payments',{m:'POST',b:data(e.target)});e.target.reset();load()}catch(x){$('#msg').textContent=x.message}};
load();
</script></body></html>
